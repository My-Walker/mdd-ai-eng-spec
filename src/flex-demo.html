<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flex 属性演示 · 查询单页</title>
  <style>
    /* ===== 主题变量 ===== */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --item: #38bdf8;
      --item-alt: #a78bfa;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% -10%, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    /* ===== 顶部区域 ===== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 20px 24px 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .app-header h1 .grad {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-header p {
      margin: 0;
      color: var(--text-dim);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .search-box::before {
      content: "\1F50D";
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.7;
    }

    .filters {
      display: flex;
      gap: 6px;
      background: var(--panel);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.is-active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0b1220;
      font-weight: 600;
    }

    .count-tip {
      font-size: 12px;
      color: var(--text-dim);
      margin-left: auto;
      white-space: nowrap;
    }

    /* ===== 卡片网格 ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      padding: 22px 24px 60px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fade-in 0.25s ease both;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .card-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .card-title code {
      font-family: "Consolas", "Fira Code", monospace;
      color: var(--accent);
      font-size: 15px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .tag.container {
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .tag.item {
      color: var(--item-alt);
      border-color: rgba(167, 139, 250, 0.4);
    }

    .card-desc {
      margin: 6px 0 0;
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .opt-btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 12px;
      font-family: "Consolas", monospace;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.16s;
    }

    .opt-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .opt-btn.is-active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* ===== 演示舞台 ===== */
    .stage {
      border: 1px dashed var(--border);
      border-radius: 10px;
      background:
        linear-gradient(var(--panel-2), var(--panel-2)) padding-box,
        repeating-linear-gradient(45deg, rgba(148, 163, 184, 0.06) 0 8px, transparent 8px 16px);
      padding: 10px;
      min-height: 132px;
      display: flex;
    }

    .stage-flex {
      flex: 1 1 auto;
      display: flex;
      min-height: 110px;
      border-radius: 8px;
    }

    .stage-item {
      flex: 0 0 auto;
      min-width: 42px;
      min-height: 38px;
      padding: 6px 10px;
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(56, 189, 248, 0.9), rgba(14, 165, 233, 0.75));
      color: #04202e;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage-item:nth-child(even) {
      background: linear-gradient(160deg, rgba(167, 139, 250, 0.9), rgba(129, 140, 248, 0.75));
      color: #1b1040;
    }

    .stage-item.is-target {
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }

    .code-hint {
      font-family: "Consolas", monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .code-hint .k {
      color: var(--accent);
    }

    .code-hint .v {
      color: #fbbf24;
    }

    /* ===== 空状态 ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state .big {
      font-size: 34px;
      margin-bottom: 8px;
    }

    /* ===== 页脚 ===== */
    .app-footer {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="app-header">
    <h1><span class="grad">Flex</span> 属性演示 · 查询单页</h1>
    <p>选择属性值即可实时预览；支持按名称 / 关键字检索过滤。</p>

    <div class="toolbar">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="输入属性名或关键字，如 grow / 对齐 / wrap" autocomplete="off" />
      </div>

      <div class="filters" id="filterGroup" role="group" aria-label="属性分类">
        <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
        <button class="filter-btn" type="button" data-filter="container">容器属性</button>
        <button class="filter-btn" type="button" data-filter="item">项目属性</button>
      </div>

      <span class="count-tip" id="countTip"></span>
    </div>
  </header>

  <main class="card-grid" id="cardGrid"></main>

  <footer class="app-footer">
    纯静态单页示例 · 无需构建 · 直接用浏览器打开即可
  </footer>

  <script>
    "use strict";

    /**
     * @typedef {{ label: string, value: string }} Option
     */

    /**
     * @typedef {Object} DemoConfig
     * @property {string} id           唯一标识
     * @property {string} property     对应 CSS 属性名
     * @property {"container" | "item"} target 作用对象
     * @property {string} description  说明文案
     * @property {string[]} keywords   检索关键字
     * @property {Option[]} options    可选值
     * @property {string} defaultValue 默认值
     * @property {number} [itemCount]    子项数量，默认 3
     * @property {number} [applyTo]      项目属性作用的下标，默认最后一个
     * @property {boolean} [wrap]        演示容器是否启用换行
     */

    /** @type {DemoConfig[]} */
    const DEMO_CONFIGS = [
      {
        id: "display",
        property: "display",
        target: "container",
        description: "将元素声明为弹性容器。flex 为块级，inline-flex 为行内级。",
        keywords: ["display", "弹性容器", "块级", "行内"],
        options: [
          { label: "flex", value: "flex" },
          { label: "inline-flex", value: "inline-flex" }
        ],
        defaultValue: "flex"
      },
      {
        id: "flex-direction",
        property: "flex-direction",
        target: "container",
        description: "决定主轴方向，即子项的排列方向。",
        keywords: ["direction", "主轴", "方向", "row", "column"],
        options: [
          { label: "row", value: "row" },
          { label: "row-reverse", value: "row-reverse" },
          { label: "column", value: "column" },
          { label: "column-reverse", value: "column-reverse" }
        ],
        defaultValue: "row"
      },
      {
        id: "flex-wrap",
        property: "flex-wrap",
        target: "container",
        description: "控制主轴空间不足时子项是否换行。",
        keywords: ["wrap", "换行", "nowrap"],
        options: [
          { label: "nowrap", value: "nowrap" },
          { label: "wrap", value: "wrap" },
          { label: "wrap-reverse", value: "wrap-reverse" }
        ],
        defaultValue: "nowrap",
        itemCount: 6
      },
      {
        id: "justify-content",
        property: "justify-content",
        target: "container",
        description: "定义子项在主轴上的对齐与分配方式。",
        keywords: ["justify", "主轴对齐", "space-between", "space-around", "space-evenly", "居中"],
        options: [
          { label: "flex-start", value: "flex-start" },
          { label: "center", value: "center" },
          { label: "flex-end", value: "flex-end" },
          { label: "space-between", value: "space-between" },
          { label: "space-around", value: "space-around" },
          { label: "space-evenly", value: "space-evenly" }
        ],
        defaultValue: "flex-start",
        itemCount: 4
      },
      {
        id: "align-items",
        property: "align-items",
        target: "container",
        description: "定义子项在交叉轴（默认垂直方向）上的对齐方式。",
        keywords: ["align", "交叉轴", "垂直对齐", "center", "baseline", "stretch"],
        options: [
          { label: "stretch", value: "stretch" },
          { label: "flex-start", value: "flex-start" },
          { label: "center", value: "center" },
          { label: "flex-end", value: "flex-end" },
          { label: "baseline", value: "baseline" }
        ],
        defaultValue: "stretch",
        itemCount: 3
      },
      {
        id: "align-content",
        property: "align-content",
        target: "container",
        description: "多行情况下，定义各行在交叉轴上的整体分布（需搭配 wrap）。",
        keywords: ["align-content", "多行", "行对齐", "wrap"],
        options: [
          { label: "stretch", value: "stretch" },
          { label: "flex-start", value: "flex-start" },
          { label: "center", value: "center" },
          { label: "flex-end", value: "flex-end" },
          { label: "space-between", value: "space-between" },
          { label: "space-around", value: "space-around" }
        ],
        defaultValue: "stretch",
        itemCount: 6,
        wrap: true
      },
      {
        id: "gap",
        property: "gap",
        target: "container",
        description: "设置子项之间的行列间距，替代传统的 margin 方案。",
        keywords: ["gap", "间距", "row-gap", "column-gap"],
        options: [
          { label: "0", value: "0px" },
          { label: "8px", value: "8px" },
          { label: "16px", value: "16px" },
          { label: "24px", value: "24px" },
          { label: "32px", value: "32px" }
        ],
        defaultValue: "8px",
        itemCount: 4,
        wrap: true
      },
      {
        id: "flex-grow",
        property: "flex-grow",
        target: "item",
        description: "子项的放大比例。演示容器默认放大最后一项以形成对比。",
        keywords: ["grow", "放大", "比例", "剩余空间"],
        options: [
          { label: "0", value: "0" },
          { label: "1", value: "1" },
          { label: "2", value: "2" },
          { label: "3", value: "3" }
        ],
        defaultValue: "0"
      },
      {
        id: "flex-shrink",
        property: "flex-shrink",
        target: "item",
        description: "空间不足时的收缩比例。收缩值越小越不易被压缩。",
        keywords: ["shrink", "收缩", "压缩"],
        options: [
          { label: "0", value: "0" },
          { label: "1", value: "1" },
          { label: "3", value: "3" },
          { label: "5", value: "5" }
        ],
        defaultValue: "1",
        applyTo: 0
      },
      {
        id: "flex-basis",
        property: "flex-basis",
        target: "item",
        description: "子项在分配多余空间前的初始主轴尺寸，优先级高于 width。",
        keywords: ["basis", "基准尺寸", "初始尺寸"],
        options: [
          { label: "auto", value: "auto" },
          { label: "60px", value: "60px" },
          { label: "120px", value: "120px" },
          { label: "200px", value: "200px" }
        ],
        defaultValue: "auto",
        applyTo: 1
      },
      {
        id: "align-self",
        property: "align-self",
        target: "item",
        description: "覆盖容器 align-items，单独控制某个子项在交叉轴上的对齐。",
        keywords: ["self", "单独对齐", "覆盖"],
        options: [
          { label: "auto", value: "auto" },
          { label: "flex-start", value: "flex-start" },
          { label: "center", value: "center" },
          { label: "flex-end", value: "flex-end" },
          { label: "stretch", value: "stretch" }
        ],
        defaultValue: "auto",
        applyTo: 1
      },
      {
        id: "order",
        property: "order",
        target: "item",
        description: "调整子项的排列顺序，数值越小越靠前，可为负值。",
        keywords: ["order", "顺序", "排序"],
        options: [
          { label: "-1", value: "-1" },
          { label: "0", value: "0" },
          { label: "1", value: "1" },
          { label: "2", value: "2" }
        ],
        defaultValue: "0",
        applyTo: 0
      }
    ];

    /**
     * 创建单个演示卡片。
     * @param {DemoConfig} config 卡片配置
     * @returns {HTMLElement} 卡片元素
     */
    function createCard(config) {
      const itemCount = typeof config.itemCount === "number" ? config.itemCount : 3;
      const applyTo = typeof config.applyTo === "number" ? config.applyTo : itemCount - 1;

      const card = document.createElement("article");
      card.className = "card";

      // ---- 头部 ----
      const head = document.createElement("div");
      head.className = "card-head";

      const title = document.createElement("div");
      title.className = "card-title";

      const code = document.createElement("code");
      code.textContent = config.property;

      const tag = document.createElement("span");
      tag.className = "tag " + config.target;
      tag.textContent = config.target === "container" ? "容器属性" : "项目属性";

      title.appendChild(code);
      title.appendChild(tag);

      const desc = document.createElement("p");
      desc.className = "card-desc";
      desc.textContent = config.description;

      head.appendChild(title);
      head.appendChild(desc);

      // ---- 主体 ----
      const body = document.createElement("div");
      body.className = "card-body";

      const hint = document.createElement("div");
      hint.className = "code-hint";

      const controls = document.createElement("div");
      controls.className = "control-row";

      // ---- 演示舞台 ----
      const stage = document.createElement("div");
      stage.className = "stage";

      const flexBox = document.createElement("div");
      flexBox.className = "stage-flex";
      flexBox.style.display = "flex";

      /** @type {HTMLElement[]} */
      const itemEls = [];
      for (let i = 0; i < itemCount; i += 1) {
        const item = document.createElement("div");
        item.className = "stage-item";
        item.textContent = String(i + 1);
        if (config.target === "item" && i === applyTo) {
          item.classList.add("is-target");
        }
        flexBox.appendChild(item);
        itemEls.push(item);
      }

      if (config.wrap === true) {
        flexBox.style.flexWrap = "wrap";
      }

      stage.appendChild(flexBox);

      // ---- 应用取值 ----
      /**
       * 将取值写入对应元素并刷新提示。
       * @param {string} value 目标取值
       * @returns {void}
       */
      const applyValue = (value) => {
        if (config.target === "container") {
          flexBox.style.setProperty(config.property, value);
        } else {
          const target = itemEls[applyTo];
          target.style.setProperty(config.property, value);
        }
        hint.innerHTML =
          '元素 <span class="k">' + (config.target === "container" ? ".stage-flex" : ".stage-item:nth-child(" + (applyTo + 1) + ")") + "</span> { " +
          '<span class="k">' + config.property + "</span>: " +
          '<span class="v">' + value + "</span>; }";
      };

      // ---- 选项按钮 ----
      /** @type {HTMLButtonElement[]} */
      const optButtons = [];
      config.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn";
        btn.textContent = opt.label;
        btn.addEventListener("click", () => {
          optButtons.forEach((other) => other.classList.remove("is-active"));
          btn.classList.add("is-active");
          applyValue(opt.value);
        });
        controls.appendChild(btn);
        optButtons.push(btn);
      });

      // 初始化默认选中项
      const defaultIndex = config.options.findIndex((opt) => opt.value === config.defaultValue);
      const activeIndex = defaultIndex >= 0 ? defaultIndex : 0;
      optButtons[activeIndex].classList.add("is-active");
      applyValue(config.options[activeIndex].value);

      body.appendChild(controls);
      body.appendChild(stage);
      body.appendChild(hint);

      card.appendChild(head);
      card.appendChild(body);

      // 检索所需的可搜索文本
      const searchText = (config.property + " " + config.description + " " + config.keywords.join(" ")).toLowerCase();
      card.dataset.category = config.target;
      card.dataset.search = searchText;

      return card;
    }

    /**
     * 依据关键字与分类过滤卡片。
     * @param {HTMLElement[]} cards 全部卡片
     * @param {string} keyword 检索关键字（小写）
     * @param {"all" | "container" | "item"} category 分类
     * @returns {number} 命中数量
     */
    function filterCards(cards, keyword, category) {
      let visible = 0;
      cards.forEach((card) => {
        const matchCategory = category === "all" || card.dataset.category === category;
        const text = card.dataset.search || "";
        const matchKeyword = keyword === "" || text.indexOf(keyword) !== -1;
        const show = matchCategory && matchKeyword;
        card.style.display = show ? "" : "none";
        if (show) {
          visible += 1;
        }
      });
      return visible;
    }

    /**
     * 初始化单页。
     * @returns {void}
     */
    function init() {
      const grid = document.getElementById("cardGrid");
      const searchInput = document.getElementById("searchInput");
      const filterGroup = document.getElementById("filterGroup");
      const countTip = document.getElementById("countTip");

      if (!grid || !searchInput || !filterGroup || !countTip) {
        return;
      }

      const emptyState = document.createElement("div");
      emptyState.className = "empty-state";
      emptyState.style.display = "none";
      const emptyIcon = document.createElement("div");
      emptyIcon.className = "big";
      emptyIcon.textContent = "\uD83D\uDD0D";
      const emptyText = document.createElement("div");
      emptyText.textContent = "没有匹配的属性，试试其它关键字";
      emptyState.appendChild(emptyIcon);
      emptyState.appendChild(emptyText);

      /** @type {HTMLElement[]} */
      const cards = DEMO_CONFIGS.map((config) => {
        const card = createCard(config);
        grid.appendChild(card);
        return card;
      });
      grid.appendChild(emptyState);

      let activeCategory = /** @type {"all" | "container" | "item"} */ ("all");

      /** @type {() => void} */
      const refresh = () => {
        const keyword = searchInput.value.trim().toLowerCase();
        const visible = filterCards(cards, keyword, activeCategory);
        emptyState.style.display = visible === 0 ? "" : "none";
        countTip.textContent = "共 " + cards.length + " 项，命中 " + visible + " 项";
      };

      searchInput.addEventListener("input", refresh);

      filterGroup.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement)) {
          return;
        }
        const filter = target.dataset.filter;
        if (filter !== "all" && filter !== "container" && filter !== "item") {
          return;
        }
        activeCategory = filter;
        filterGroup.querySelectorAll(".filter-btn").forEach((btn) => btn.classList.remove("is-active"));
        target.classList.add("is-active");
        refresh();
      });

      refresh();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>
